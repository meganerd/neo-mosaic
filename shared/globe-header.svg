<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 200" width="3000" height="200">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4D4D4"/>
      <stop offset="40%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#A8A8A8"/>
    </linearGradient>
    <!-- Mosaic logo gradient -->
    <radialGradient id="logoGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3C2FA0"/>
      <stop offset="35%" stop-color="#241893"/>
      <stop offset="65%" stop-color="#190E6A"/>
      <stop offset="85%" stop-color="#140A50"/>
      <stop offset="100%" stop-color="#0E0738"/>
    </radialGradient>
    <!-- Logo highlight -->
    <radialGradient id="logoShine" cx="32%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3000" height="200" fill="url(#headerGrad)"/>
  <rect width="3000" height="2" fill="#DCDCDC"/>

  <!-- NCSA Mosaic "M" Logo (globe variant) -->
  <g transform="translate(25, 20)">
    <!-- Main "M" letterform silhouette -->
    <!-- Top diamond/globe element -->
    <path d="
      M 60,0
      C 70,0 82,3 92,10
      C 102,17 108,26 110,36
      C 112,46 108,54 100,58
      C 88,64 72,66 55,68
      C 38,70 22,70 10,68
      C -2,66 -12,60 -18,52
      C -24,44 -26,34 -24,26
      C -22,18 -16,12 -8,8
      C 0,4 10,2 20,2
      C 35,2 48,0 60,0
      Z
    " fill="url(#logoGrad)" stroke="#0E0738" stroke-width="0.5"/>

    <!-- Right vertical stroke of "M" -->
    <path d="
      M 90,60
      C 98,72 104,86 108,100
      C 112,114 114,130 114,144
      C 114,158 112,170 108,178
      C 104,186 98,190 90,190
      C 82,190 76,186 72,178
      C 68,170 66,158 66,144
      C 66,130 68,114 72,100
      C 76,86 82,72 90,60
      Z
    " fill="url(#logoGrad)" stroke="#0E0738" stroke-width="0.5"/>

    <!-- Horizontal connection (M crossbar area) -->
    <path d="
      M 10,130
      C 20,128 32,126 44,126
      C 56,126 68,128 78,132
      C 88,136 96,142 102,148
      C 108,154 110,160 108,166
      C 106,172 100,176 92,176
      C 84,176 74,172 64,166
      C 54,160 44,154 34,148
      C 24,142 16,138 10,136
      C 4,134 2,132 10,130
      Z
    " fill="url(#logoGrad)" stroke="#0E0738" stroke-width="0.5"/>

    <!-- Left diagonal / base -->
    <path d="
      M -20,120
      C -12,124 -4,130 2,138
      C 8,146 12,156 14,166
      C 16,176 14,184 8,190
      C 2,196 -6,198 -14,196
      C -22,194 -28,188 -32,180
      C -36,172 -38,162 -36,152
      C -34,142 -30,134 -24,128
      C -18,122 -14,120 -20,120
      Z
    " fill="url(#logoGrad)" stroke="#0E0738" stroke-width="0.5"/>

    <!-- Highlight overlay -->
    <path d="
      M 60,0
      C 70,0 82,3 92,10
      C 102,17 108,26 110,36
      C 112,46 108,54 100,58
      C 88,64 72,66 55,68
      C 38,70 22,70 10,68
      C -2,66 -12,60 -18,52
      C -24,44 -26,34 -24,26
      C -22,18 -16,12 -8,8
      C 0,4 10,2 20,2
      C 35,2 48,0 60,0
      Z
    " fill="url(#logoShine)"/>

    <!-- Subtle grid lines on top element -->
    <g fill="none" stroke="#B0A8E0" stroke-width="0.4" opacity="0.2">
      <ellipse cx="42" cy="35" rx="15" ry="30" transform="rotate(-10, 42, 35)"/>
      <ellipse cx="42" cy="35" rx="30" ry="30" transform="rotate(-10, 42, 35)"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="160" y="110" font-family="'Courier New', 'Andale Mono', monospace" font-size="28" font-weight="bold" fill="#2B2B2B" letter-spacing="4">neo-mosaic</text>
  <text x="160" y="136" font-family="'Courier New', 'Andale Mono', monospace" font-size="14" fill="#666666" letter-spacing="2">GLOBE VARIANT</text>
  <!-- URL bar mockup -->
  <rect x="400" y="88" width="600" height="28" rx="2" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="408" y="107" font-family="'Courier New', monospace" font-size="13" fill="#000080">http://www.ncsa.uiuc.edu/</text>
  <!-- Bottom bevel -->
  <rect width="3000" height="1" y="198" fill="#808080"/>
</svg>
