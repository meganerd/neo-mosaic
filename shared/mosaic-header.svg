<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 200" width="3000" height="200">
  <defs>
    <!-- 90s web texture: fine grain/noise pattern -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="2" result="noise"/>
      <feColorMatrix type="matrix" values="
        0.33  0     0     0   0.65
        0     0.33  0     0   0.63
        0     0     0.33  0   0.66
        0     0     0     0.35 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in="coloredNoise" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="coloredNoise" in2="SourceGraphic"/>
    </filter>

    <!-- Subtle gradient overlay for depth -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D0D0"/>
      <stop offset="50%" stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#B8B8B8"/>
    </linearGradient>

    <!-- Diamond logo gradient -->
    <linearGradient id="diamondTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4466DD"/>
      <stop offset="40%" stop-color="#2244AA"/>
      <stop offset="100%" stop-color="#112266"/>
    </linearGradient>
    <linearGradient id="diamondRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44AA44"/>
      <stop offset="40%" stop-color="#228822"/>
      <stop offset="100%" stop-color="#115511"/>
    </linearGradient>
    <linearGradient id="diamondBottom" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#DD4444"/>
      <stop offset="40%" stop-color="#AA2222"/>
      <stop offset="100%" stop-color="#661111"/>
    </linearGradient>
    <linearGradient id="diamondLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDDD44"/>
      <stop offset="40%" stop-color="#AAAA22"/>
      <stop offset="100%" stop-color="#666611"/>
    </linearGradient>

    <!-- Motif-style bevel -->
    <linearGradient id="bevelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="bevelBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>

    <!-- Header title bar gradient -->
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#000060"/>
    </linearGradient>
  </defs>

  <!-- Main background with 90s texture -->
  <rect width="3000" height="200" fill="url(#bgGrad)"/>
  <rect width="3000" height="200" fill="url(#bgGrad)" filter="url(#noise)" opacity="0.7"/>

  <!-- Top bevel highlight -->
  <rect width="3000" height="2" fill="url(#bevelTop)"/>
  <!-- Bottom bevel shadow -->
  <rect y="196" width="3000" height="4" fill="url(#bevelBottom)"/>

  <!-- Dark title bar band -->
  <rect y="0" width="3000" height="20" fill="url(#titleBar)"/>
  <!-- Title bar text -->
  <text x="10" y="14" font-family="'MS Sans Serif', 'Helvetica', Arial, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">NCSA Mosaic - Welcome!</text>
  <!-- Title bar buttons -->
  <rect x="2940" y="3" width="14" height="14" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <rect x="2960" y="3" width="14" height="14" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>
  <rect x="2980" y="3" width="14" height="14" fill="#C0C0C0" stroke="#000000" stroke-width="1"/>

  <!-- Menu bar -->
  <rect y="20" width="3000" height="22" fill="#C0C0C0"/>
  <text x="8" y="35" font-family="'MS Sans Serif', 'Helvetica', Arial, sans-serif" font-size="12" fill="#000000">File  Edit  Options  Navigate  Annotate  Help</text>

  <!-- Toolbar area -->
  <rect y="42" width="3000" height="24" fill="#D4D4D4"/>
  <!-- Toolbar buttons -->
  <g fill="#C0C0C0" stroke="#808080" stroke-width="0.5">
    <rect x="4" y="44" width="22" height="20" rx="0"/>
    <rect x="28" y="44" width="22" height="20" rx="0"/>
    <rect x="52" y="44" width="22" height="20" rx="0"/>
    <rect x="76" y="44" width="22" height="20" rx="0"/>
    <rect x="100" y="44" width="22" height="20" rx="0"/>
    <rect x="124" y="44" width="22" height="20" rx="0"/>
    <rect x="148" y="44" width="22" height="20" rx="0"/>
  </g>
  <!-- URL bar -->
  <rect x="180" y="45" width="600" height="18" rx="0" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="185" y="57" font-family="'Courier New', monospace" font-size="11" fill="#000080">http://www.ncsa.uiuc.edu/</text>

  <!-- Content area background (90s texture) -->
  <rect y="66" width="3000" height="134" fill="#C0C0C0"/>
  <rect y="66" width="3000" height="134" fill="#C0C0C0" filter="url(#noise)" opacity="0.5"/>

  <!-- NCSA Mosaic Diamond Logo (top-left) -->
  <g transform="translate(30, 72)">
    <!-- Logo shadow -->
    <polygon points="55,106 110,52 55,106 0,52" fill="#000000" opacity="0.2"/>
    <!-- Diamond: 4 triangles forming the NCSA Mosaic logo -->
    <!-- Top (blue) -->
    <polygon points="55,4 106,55 55,55" fill="url(#diamondTop)"/>
    <!-- Right (green) -->
    <polygon points="106,55 55,106 55,55" fill="url(#diamondRight)"/>
    <!-- Bottom (red) -->
    <polygon points="4,55 55,106 55,55" fill="url(#diamondBottom)"/>
    <!-- Left (yellow) -->
    <polygon points="55,4 4,55 55,55" fill="url(#diamondLeft)"/>
    <!-- Outer border -->
    <polygon points="55,0 110,55 55,110 0,55" fill="none" stroke="#000000" stroke-width="1.5"/>
    <!-- Inner diamond -->
    <polygon points="55,22 88,55 55,88 22,55" fill="#FFFFFF" opacity="0.15"/>
    <!-- Highlight sheen -->
    <polygon points="55,4 106,55 80,55 55,30" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- Welcome heading text -->
  <text x="195" y="100" font-family="'Times New Roman', 'Georgia', serif" font-size="28" font-weight="bold" fill="#000080">Welcome to NCSA Mosaic</text>
  <text x="195" y="122" font-family="'Helvetica', Arial, sans-serif" font-size="14" fill="#000000">A global hypermedia browser for the Internet.</text>

  <!-- Navigation links -->
  <g font-family="'Helvetica', Arial, sans-serif" font-size="13" fill="#0000FF" text-decoration="underline">
    <text x="195" y="148">Getting Started</text>
    <text x="195" y="168">What's New!</text>
    <text x="195" y="188">Frequently Asked Questions</text>
  </g>

  <!-- Right-side decorative element: globe graphic -->
  <g transform="translate(2800, 80)" opacity="0.3">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#666666" stroke-width="1"/>
    <ellipse cx="50" cy="50" rx="10" ry="45" fill="none" stroke="#666666" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="25" ry="45" fill="none" stroke="#666666" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="35" ry="45" fill="none" stroke="#666666" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="45" ry="10" fill="none" stroke="#666666" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="45" ry="25" fill="none" stroke="#666666" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="45" ry="35" fill="none" stroke="#666666" stroke-width="0.5"/>
  </g>

  <!-- Status bar at bottom -->
  <rect y="194" width="3000" height="6" fill="#C0C0C0"/>
  <rect y="194" width="3000" height="1" fill="#808080"/>
  <rect y="199" width="3000" height="1" fill="#FFFFFF"/>

  <!-- Mosaic logo watermark (right side, subtle) -->
  <g transform="translate(2650, 130)" opacity="0.08">
    <polygon points="30,0 60,30 30,60 0,30" fill="none" stroke="#000080" stroke-width="2"/>
  </g>
</svg>
