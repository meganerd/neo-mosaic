<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 200" width="3000" height="200">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4D4D4"/>
      <stop offset="40%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#A8A8A8"/>
    </linearGradient>
  </defs>
  <rect width="3000" height="200" fill="url(#headerGrad)"/>
  <rect width="3000" height="2" fill="#DCDCDC"/>

  <!-- Globe logo area -->
  <g transform="translate(30, -10)">
    <!-- Globe shadow -->
    <ellipse cx="140" cy="185" rx="80" ry="10" fill="#000000" opacity="0.12"/>
    <!-- Globe sphere -->
    <circle cx="140" cy="120" r="80" fill="#2A218B"/>
    <!-- Globe gradient overlay -->
    <circle cx="140" cy="120" r="80" fill="url(#headerGrad)" opacity="0.15"/>
    <!-- Longitude lines -->
    <g fill="none" stroke="#8A8A9A" stroke-width="0.8" opacity="0.4">
      <ellipse cx="140" cy="120" rx="12" ry="80"/>
      <ellipse cx="140" cy="120" rx="34" ry="80"/>
      <ellipse cx="140" cy="120" rx="56" ry="80"/>
      <ellipse cx="140" cy="120" rx="70" ry="80"/>
      <ellipse cx="140" cy="120" rx="68" ry="80" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="52" ry="80" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="32" ry="80" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="10" ry="80" stroke="#5A5A7A" stroke-dasharray="2,3"/>
    </g>
    <!-- Latitude lines -->
    <g fill="none" stroke="#8A8A9A" stroke-width="0.8" opacity="0.4">
      <ellipse cx="140" cy="120" rx="80" ry="6"/>
      <ellipse cx="140" cy="120" rx="80" ry="20"/>
      <ellipse cx="140" cy="120" rx="80" ry="36"/>
      <ellipse cx="140" cy="120" rx="80" ry="56"/>
      <ellipse cx="140" cy="120" rx="80" ry="70"/>
      <ellipse cx="140" cy="120" rx="80" ry="70" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="80" ry="55" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="80" ry="35" stroke="#5A5A7A" stroke-dasharray="2,3"/>
      <ellipse cx="140" cy="120" rx="80" ry="20" stroke="#5A5A7A" stroke-dasharray="2,3"/>
    </g>
    <!-- Globe highlight -->
    <circle cx="130" cy="105" r="30" fill="#FFFFFF" opacity="0.08"/>
    <!-- Decorative ring -->
    <path d="M 52,120 A 100,60 0 0,0 228,120" fill="none" stroke="#B8956A" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Title text -->
  <text x="290" y="120" font-family="'Courier New', 'Andale Mono', monospace" font-size="28" font-weight="bold" fill="#2B2B2B" letter-spacing="4">neo-mosaic</text>
  <text x="290" y="146" font-family="'Courier New', 'Andale Mono', monospace" font-size="14" fill="#666666" letter-spacing="2">SPINNING GLOBE VARIANT</text>
  <!-- URL bar mockup -->
  <rect x="560" y="95" width="600" height="28" rx="2" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="570" y="114" font-family="'Courier New', monospace" font-size="13" fill="#000080">http://www.ncsa.uiuc.edu/</text>
  <!-- Bottom bevel -->
  <rect width="3000" height="1" y="198" fill="#808080"/>
</svg>
